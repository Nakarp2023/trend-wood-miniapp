 else if(p.id==='xbox') rows=[['🇪🇺 Европа','от 1 490 ₽','eu'],['🇺🇸 США','от 1 290 ₽','us']];
 else if(p.id==='ps') rows=[['✕ Подписки PS Plus','от 2 990 ₽','plus'],['💳 Пополнение счёта','от 690 ₽','topup']];
 else rows=(p.values||[]).map((x,i)=>[p.id==='fortnite'?'Fortnite | '+x:p.id==='roblox'?'Roblox | '+x:p.id==='discord'?'Discord '+x:p.id==='telegram'?'Telegram Premium | '+x:x,rub(p.prices?.[i]||p.price),String(i)]);
 v.innerHTML='<section class="product-page"><button class="back-product" onclick="productPage=null;renderTab()">‹</button><div class="product-head"><div class="logo '+(p.bg||'')+'">'+brandMark(p.id)+'</div><h1>'+p.name+'</h1></div><div class="product-options">'+rows.map((r,i)=>'<button class="product-choice" onclick="chooseProductOption(\''+p.id+'\',\''+r[2]+'\')"><span>'+r[0]+'<small>'+r[1]+'</small></span><span class="choice-circle">›</span></button>').join('')+'</div></section>';
}
function chooseProductOption(id,key){
 if(id==='apple'){appleRegion(key);return}
 if(id==='ps'){psCategory(key);return}
 const p=P.find(x=>x.id===id),i=Number(key),v=p.values[i],price=p.prices?.[i]||p.price;
 cart.push({name:p.name,region:'',value:v,price});localStorage.setItem('tw_cart',JSON.stringify(cart));toast('Добавлено в корзину');
}
function renderVariantScreen(title,icon,variants,subtitle,note){
 document.getElementById('sheet').innerHTML='<div class="sheet-head"><small>'+subtitle+'</small><button class="close" onclick="closeModal()">×</button></div><div class="detail-logo">'+icon+'</div><h2>'+title+'</h2>'+(note?'<p class="steps">'+note+'</p>':'')+'<div class="group">'+variants.map((v,i)=>'<button class="item" onclick="selectedVariant('+i+')"><span><b>'+v.name+'</b><br><small>от '+rub(v.price)+'</small></span><span>◯</span></button>').join('')+'</div>';
 window.detailVariants=variants;openModal();
}
function selectedVariant(i){let v=window.detailVariants[i];cart.push({name:selected.name||'Товар',region:'',value:v.name,price:v.price});localStorage.setItem('tw_cart',JSON.stringify(cart));closeModal();toast('Добавлено в корзину')}
function psCategory(type){
 let arr,head;
 if(type==='topup'){head='💳 Пополнение счёта';arr=[{name:'🇹🇷 Турция',price:790},{name:'🇺🇸 США',price:690}];}
 else if(type==='plus'){head='✕ Подписки PS Plus';arr=[{name:'Тариф Essential',price:2990},{name:'Тариф Extra',price:4490},{name:'Тариф Deluxe',price:5390}];}
 else{head='Тариф EA Play';arr=[{name:'EA Play',price:4990}];}
 if(type==='plus')arr.push({name:'Тариф EA Play',price:4990});
 renderVariantScreen(head,'🎮',arr,'PlayStation','Выберите нужный вариант');
}
function appleRegion(region){
 let arr=region==='ru'?[{name:'Apple Gift Card 500 ₽',price:950},{name:'Apple Gift Card 600 ₽',price:1190},{name:'Apple Gift Card 1000 ₽',price:1900},{name:'Apple Gift Card 2000 ₽',price:3490},{name:'Apple Gift Card 3000 ₽',price:5390},{name:'Apple Gift Card 5000 ₽',price:8490}]:[{name:'Apple Gift Card $10',price:1450},{name:'Apple Gift Card $20',price:2590},{name:'Apple Gift Card $25',price:3190},{name:'Apple Gift Card $50',price:5940},{name:'Apple Gift Card $100',price:11960}];
 renderVariantScreen(region==='ru'?'🇷🇺 Россия':'🇺🇸 Америка','',arr,'Apple Gift Cards','Данные коды подойдут для аккаунтов Apple ID, если у вас выбран регион: '+(region==='ru'?'Россия 🇷🇺':'США 🇺🇸'));
}
function pick(e){e.parentElement.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');if(e.parentElement.id==='values'&&selected){let i=[...e.parentElement.querySelectorAll('.option')].indexOf(e);let price=selected.prices?.[i]||selected.price;let el=document.getElementById('variantPrice');if(el)el.textContent=rub(price)}}
function addCart(){let p=selected;let ri=[...document.querySelectorAll('#regions .option')].indexOf(document.querySelector('#regions .selected'));let vi=[...document.querySelectorAll('#values .option')].indexOf(document.querySelector('#values .selected'));cart.push({name:p.name,region:document.querySelector('#regions .selected').textContent,value:document.querySelector('#values .selected').textContent,price:p.prices?.[vi]||p.price});localStorage.setItem('tw_cart',JSON.stringify(cart));closeModal();renderTab();toast('Добавлено в корзину')}
function openCart(){document.getElementById('sheet').innerHTML='<div class="sheet-head"><h2>Корзина</h2><button class="close" onclick="closeModal()">×</button></div>'+(cart.map((x,i)=>'<div class="line"><span>'+x.name+'<br><small>'+x.region+' · '+x.value+'</small></span><b>'+rub(x.price)+'</b><button onclick="cart.splice('+i+',1);localStorage.setItem(\'tw_cart\',JSON.stringify(cart));openCart()">×</button></div>').join('')||'<p>Корзина пуста</p>')+'<h3>Итого: '+rub(cart.reduce((a,x)=>a+x.price,0))+'</h3><button class="primary wide" onclick="checkout()">Создать заказ · демо</button><p>Платежи пока отключены. Заказ будет ожидать оплаты.</p>';openModal()}
function checkout(){if(!cart.length)return;orders.unshift({id:'TW-'+Date.now().toString().slice(-6),date:new Date().toLocaleDateString('ru-RU'),total:cart.reduce((a,x)=>a+x.price,0),status:'Ожидает оплаты · демо'});localStorage.setItem('tw_orders',JSON.stringify(orders));cart=[];localStorage.setItem('tw_cart','[]');closeModal();tab='orders';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));renderTab()}
function info(t,s){document.getElementById('sheet').innerHTML='<div class="sheet-head"><h2>'+t+'</h2><button class="close" onclick="closeModal()">×</button></div><p>'+s+'</p>';openModal()}
function openModal(){document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
renderTab();
</script></body></html>
