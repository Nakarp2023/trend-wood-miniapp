<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101114"><title>TREND WOOD — цифровой магазин</title>
<style>
:root{--bg:#101114;--panel:#19181d;--panel2:#222127;--line:#302e36;--text:#f7f5f8;--muted:#a6a2ad;--accent:#c7a6ff;--accent2:#9b72ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:88px;background:radial-gradient(ellipse at 80% -10%,#30233e 0,transparent 38%),var(--bg)}header{padding:24px 20px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2.2px;font-size:18px}.brand span{color:var(--accent)}.tg{background:#26232d;border:1px solid var(--line);padding:9px 13px;border-radius:13px;color:#ddd6e9;font-size:12px}.hero{margin:0 16px 20px;padding:22px;border-radius:24px;background:linear-gradient(135deg,#302340,#1d1b25 70%);border:1px solid #443653;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:18px;top:8px;font-size:95px;color:#a37ae8;opacity:.12}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#c8b2e8}.hero h1{font-size:27px;line-height:1.13;margin:10px 0 9px;max-width:280px}.hero p{color:#c5bdce;margin:0 0 18px;font-size:13px}.primary{background:linear-gradient(135deg,#c7a6ff,#9870e8);color:#17111f;font-weight:750;border-radius:14px;padding:12px 17px}.section{padding:0 16px;margin:22px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 13px}.section h2{font-size:18px;margin:0;font-weight:750}.small{font-size:12px;color:var(--muted)}.switch{display:flex;background:#1b1a20;border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:14px}.switch button{flex:1;background:transparent;padding:10px;border-radius:10px;color:var(--muted);font-weight:650}.switch button.active{background:#393044;color:#f4eaff}.search{width:100%;background:#1b1a20;border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:white;outline:none;margin-bottom:13px}.search:focus{border-color:#8b6bb9}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.chip{white-space:nowrap;background:#1b1a20;border:1px solid var(--line);padding:8px 13px;border-radius:99px;font-size:12px;color:#bcb7c5}.chip.active{background:#33283f;border-color:#76549c;color:#e6d5ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}.art{height:115px;display:grid;place-items:center;background:linear-gradient(145deg,#292333,#17161b);font-size:43px;position:relative}.art:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#9d75c51c,transparent 65%)}.product-body{padding:12px}.tag{font-size:10px;color:#c6a6ff;background:#342742;border-radius:6px;padding:4px 6px;display:inline-block;margin-bottom:7px}.product h3{font-size:13px;margin:0 0 7px;line-height:1.35;min-height:35px}.price{font-weight:800;font-size:15px}.product-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.add{width:31px;height:31px;border-radius:10px;background:#c5a2ff;color:#17111f;font-size:20px;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#17161beF;backdrop-filter:blur(18px);border-top:1px solid #302e36;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav{background:transparent;color:#898491;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:5px}.nav b{font-size:20px;font-weight:500}.nav.active{color:#d4baff}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#31283e;border:1px solid #60477f;border-radius:13px;padding:11px 16px;font-size:13px;z-index:10;display:none;white-space:nowrap}
</style>
</head>
<body><main class="app">
<header><div class="brand">TREND <span>WOOD</span></div><button class="tg" onclick="toast('Поддержка: скоро подключим Telegram-менеджера')">Поддержка ↗</button></header>
<section class="hero"><div class="eyebrow">Digital store · 24/7</div><h1>Твой цифровой мир — в одном месте</h1><p>Коды, подписки и приложения с быстрой выдачей.</p><button class="primary" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Перейти в каталог →</button></section>
<section class="section" id="catalog"><div class="section-head"><h2>Каталог</h2><span class="small" id="count">8 товаров</span></div>
<div class="switch"><button class="active" data-mode="codes">🎟 Коды</button><button data-mode="apps">📲 Приложения</button></div>
<input class="search" id="search" placeholder="⌕  Поиск товара…" />
<div class="chips" id="chips"><button class="chip active" data-cat="Все">Все</button><button class="chip" data-cat="Игры">Игры</button><button class="chip" data-cat="Подарочные карты">Подарочные карты</button><button class="chip" data-cat="Подписки">Подписки</button><button class="chip" data-cat="Сервисы">Сервисы</button></div>
<div class="grid" id="products"></div></section>
<section class="section" id="content"><div class="section-head"><h2>Покупки без лишнего</h2></div><div style="background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--muted);font-size:13px">Выбирай продукт, оформляй заказ и получай цифровой товар в Telegram. Оплата будет подключена через Telegram Stars.</div></section>
<nav class="bottom"><button class="nav active" data-tab="catalog"><b>⌂</b>Каталог</button><button class="nav" data-tab="orders"><b>▤</b>Заказы</button><button class="nav" data-tab="ref"><b>♧</b>Рефералы</button><button class="nav" data-tab="profile"><b>◉</b>Профиль</button></nav>
<div class="toast" id="toast"></div></main>
<script>
const items=[
{n:'Apple Gift Card Россия',cat:'Подарочные карты',mode:'codes',icon:'',p:'от 500 ₽',tag:'Apple'},
{n:'Apple Gift Card США',cat:'Подарочные карты',mode:'codes',icon:'',p:'от $5',tag:'USA'},
{n:'PlayStation Store',cat:'Игры',mode:'codes',icon:'🎮',p:'от 1 000 ₽',tag:'PSN'},
{n:'Xbox Gift Card',cat:'Игры',mode:'codes',icon:'🟩',p:'от 500 ₽',tag:'Xbox'},
{n:'Roblox Gift Card',cat:'Игры',mode:'codes',icon:'🧱',p:'от 500 ₽',tag:'Roblox'},
{n:'Fortnite V-Bucks',cat:'Игры',mode:'codes',icon:'⚡',p:'от 500 ₽',tag:'Games'},
{n:'Discord Nitro',cat:'Подписки',mode:'codes',icon:'💠',p:'от 299 ₽',tag:'Nitro'},
{n:'Telegram Premium',cat:'Подписки',mode:'codes',icon:'✈️',p:'от 299 ₽',tag:'Premium'},
{n:'Премиум-приложения',cat:'Сервисы',mode:'apps',icon:'✨',p:'от 199 ₽',tag:'Apps'},
{n:'AI-сервисы',cat:'Сервисы',mode:'apps',icon:'🤖',p:'от 299 ₽',tag:'AI'},
{n:'Подписки для iPhone',cat:'Подписки',mode:'apps',icon:'📱',p:'от 199 ₽',tag:'iOS'}
];let mode='codes',cat='Все';
function render(){let q=document.getElementById('search').value.toLowerCase();let a=items.filter(x=>x.mode===mode&&(cat==='Все'||x.cat===cat)&&(x.n.toLowerCase().includes(q)||x.tag.toLowerCase().includes(q)));document.getElementById('count').textContent=a.length+' товаров';document.getElementById('products').innerHTML=a.map(x=>'<article class="product"><div class="art">'+x.icon+'</div><div class="product-body"><span class="tag">'+x.tag+'</span><h3>'+x.n+'</h3><div class="product-foot"><span class="price">'+x.p+'</span><button class="add" onclick="toast(\'Выбран: '+x.n+' — скоро откроем оформление\')">+</button></div></div></article>').join('')||'<div class="empty">Ничего не найдено</div>'}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));cat='Все';document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat==='Все'));render()});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});
document.getElementById('search').oninput=render;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab!=='catalog')toast(({orders:'Раздел заказов подключим следующим этапом',ref:'Реферальная система: 10% вознаграждения',profile:'Профиль и настройки пользователя'})[b.dataset.tab])});
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2600)}
render();
</script></main></body></html>
