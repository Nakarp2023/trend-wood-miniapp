<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>TREND WOOD</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e5e8;--blue:#0071e3;--blue2:#eaf3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{max-width:600px;margin:auto;min-height:100dvh;padding-bottom:95px}header{padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:1.7px;font-size:19px}.brand span{color:var(--blue)}.support{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:30px;color:var(--blue);font-size:13px}
.hero{margin:5px 16px 22px;padding:24px;border-radius:25px;background:linear-gradient(135deg,#fff,#eaf2ff);border:1px solid #e1eaf8}.eyebrow{font-size:11px;letter-spacing:1.6px;color:#66788e;font-weight:650}.hero h1{font-size:31px;line-height:1.08;letter-spacing:-1.1px;margin:12px 0 9px;max-width:390px}.hero p{color:#5e6671;margin:0 0 17px;font-size:14px}.primary{background:var(--blue);color:white;padding:12px 17px;border-radius:13px;font-weight:650}.section{padding:0 17px;margin:20px 0}.head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 13px}.head h2{font-size:23px;letter-spacing:-.5px;margin:0;font-weight:750}.muted{color:var(--muted);font-size:13px}.seg{display:flex;background:#e9e9ed;padding:4px;border-radius:13px;margin-bottom:12px}.seg button{flex:1;background:transparent;color:#626269;padding:10px 5px;border-radius:10px;font-weight:650}.seg button.active{background:white;color:var(--ink);box-shadow:0 1px 4px #0001}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none;margin-bottom:12px}.search:focus{border-color:#8bbcff}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px}.chip{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:99px;font-size:12px;color:#53535a}.chip.active{background:var(--blue2);border-color:#b8d8ff;color:#005bbb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid #e9e9ed;border-radius:19px;overflow:hidden;box-shadow:0 3px 12px #00000005;cursor:pointer}.art{height:125px;display:grid;place-items:center;background:linear-gradient(145deg,#f5f7fa,#e9edf3);font-size:48px;position:relative}.art small{position:absolute;right:9px;top:8px;font-size:10px;background:#ffffffc9;border-radius:7px;padding:4px 7px;color:#555}.bodyp{padding:12px}.tag{font-size:10px;color:#64748b;background:#f1f4f8;border-radius:6px;padding:4px 6px;display:inline-block;margin-bottom:7px}.product h3{font-size:14px;margin:0 0 9px;line-height:1.3;min-height:37px;font-weight:650}.footp{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.price{font-weight:750;font-size:14px}.add{width:31px;height:31px;border-radius:50%;background:var(--blue);color:white;font-size:22px;line-height:1}.empty{grid-column:1/-1;text-align:center;padding:24px;color:var(--muted);background:#fff;border-radius:16px}.steps{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;color:#53535a;font-size:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(22px);border-top:1px solid #e5e5e8;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav{background:transparent;color:#77777d;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:5px;position:relative}.nav b{font-size:21px;font-weight:500}.nav.active{color:var(--blue)}.badge{position:absolute;top:0;right:20%;background:#ff453a;color:#fff;border-radius:20px;font-size:9px;padding:2px 5px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222;color:white;border-radius:13px;padding:11px 16px;font-size:12px;z-index:30;display:none;max-width:90%;text-align:center}.modal{position:fixed;inset:0;background:#0005;backdrop-filter:blur(6px);z-index:20;display:none;align-items:flex-end;justify-content:center}.sheet{width:min(600px,100%);background:#fff;border-radius:25px 25px 0 0;padding:20px 20px calc(25px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}.sheettop{display:flex;justify-content:space-between;align-items:center}.close{background:#f1f1f4;border-radius:50%;width:35px;height:35px;font-size:20px}.detailart{height:145px;border-radius:18px;background:linear-gradient(140deg,#f4f7fb,#e6edf6);display:grid;place-items:center;font-size:60px;margin:15px 0}.sheet h2{font-size:23px;margin:10px 0}.sheet p{color:var(--muted);font-size:13px}.options{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 17px}.option{border:1px solid var(--line);background:#f7f7f9;border-radius:10px;padding:9px 12px;font-size:12px}.option.selected{border-color:var(--blue);background:var(--blue2);color:#005bbb}.wide{width:100%;margin-top:12px}.cartrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;font-size:13px}.cartrow button{background:#f1f1f4;border-radius:8px;padding:6px 9px;color:#d22}.total{display:flex;justify-content:space-between;font-weight:800;padding:16px 0}
</style></head><body><main class="app">
<header><div class="brand">TREND <span>WOOD</span></div><button class="support" onclick="toast('Поддержка будет подключена к Telegram')">Поддержка ↗</button></header>
<section class="hero"><div class="eyebrow">DIGITAL STORE · 24/7</div><h1>Всё цифровое.<br>В одном месте.</h1><p>Подарочные карты, игровые коды и подписки — в удобном каталоге.</p><button class="primary" onclick="goCatalog()">Открыть каталог →</button></section>
<section class="section" id="catalog"><div class="head"><h2>Каталог</h2><span class="muted" id="count">0 товаров</span></div><div class="seg"><button class="active" data-mode="codes">🎟 Коды</button><button data-mode="apps">📲 Приложения</button></div><input class="search" id="search" placeholder="⌕  Найти товар или подписку…"><div class="chips" id="chips"><button class="chip active" data-cat="Все">Все</button><button class="chip" data-cat="Игры">Игры</button><button class="chip" data-cat="Подарочные карты">Подарочные карты</button><button class="chip" data-cat="Подписки">Подписки</button><button class="chip" data-cat="Сервисы">Сервисы</button></div><div class="grid" id="products"></div></section>
<section class="section"><div class="head"><h2>Покупать просто</h2><span class="muted">3 шага</span></div><div class="steps">① Выбери цифровой товар<br><br>② Укажи регион и номинал<br><br>③ Получи заказ после оформления</div></section>
<nav class="bottom"><button class="nav active" data-tab="catalog"><b>⌂</b>Каталог</button><button class="nav" data-tab="orders"><b>▤</b>Заказы</button><button class="nav" data-tab="ref"><b>♧</b>Рефералы</button><button class="nav" data-tab="profile"><b>◉</b>Профиль</button></nav><div class="toast" id="toast"></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div></main>
<script>
const products=[
{id:'apple-ru',n:'Apple Gift Card · Россия',cat:'Подарочные карты',mode:'codes',icon:'',price:500,tag:'Apple',region:['Россия'],values:[500,1000,2000,5000]},
{id:'apple-us',n:'Apple Gift Card · США',cat:'Подарочные карты',mode:'codes',icon:'',price:700,tag:'USA',region:['США'],values:[10,25,50,100]},
{id:'ps',n:'PlayStation Store',cat:'Игры',mode:'codes',icon:'🎮',price:1000,tag:'PlayStation',region:['США','Турция','Европа'],values:[10,20,50,100]},
{id:'xbox',n:'Xbox Gift Card',cat:'Игры',mode:'codes',icon:'🟩',price:1000,tag:'Xbox',region:['США','Европа'],values:[10,25,50,100]},
{id:'roblox',n:'Roblox',cat:'Игры',mode:'codes',icon:'🟥',price:500,tag:'Roblox',region:['США'],values:[10,20,50]},
{id:'fortnite',n:'Fortnite V-Bucks',cat:'Игры',mode:'codes',icon:'🪙',price:800,tag:'Fortnite',region:['США','Европа'],values:[1000,2800,5000,13500]},
{id:'discord',n:'Discord Nitro',cat:'Подписки',mode:'codes',icon:'💬',price:990,tag:'Discord',region:['Global'],values:['1 месяц','12 месяцев']},
{id:'telegram',n:'Telegram Premium',cat:'Подписки',mode:'apps',icon:'✈️',price:299,tag:'Telegram',region:['Россия'],values:['1 месяц','3 месяца','12 месяцев']},
{id:'ai',n:'AI-сервисы',cat:'Сервисы',mode:'apps',icon:'🤖',price:499,tag:'AI',region:['Global'],values:['1 месяц','3 месяца']},
{id:'ios',n:'Приложения iOS',cat:'Сервисы',mode:'apps',icon:'📱',price:199,tag:'iOS',region:['App Store'],values:['Покупка','Подписка']},
{id:'appsub',n:'Подписки приложений',cat:'Подписки',mode:'apps',icon:'✨',price:299,tag:'Apps',region:['Global'],values:['1 месяц','12 месяцев']}
];
let mode='codes',cat='Все',cart=JSON.parse(localStorage.getItem('tw_cart')||'[]'),orders=JSON.parse(localStorage.getItem('tw_orders')||'[]');
const rub=n=>Number(n).toLocaleString('ru-RU')+' ₽';
function goCatalog(){document.getElementById('catalog').scrollIntoView({behavior:'smooth'})}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=products.filter(p=>p.mode===mode&&(cat==='Все'||p.cat===cat)&&(!q||(p.n+' '+p.tag+' '+p.cat).toLowerCase().includes(q)));document.getElementById('count').textContent=list.length+' товаров';document.getElementById('products').innerHTML=list.length?list.map(p=>`<article class="product" onclick="detail('${p.id}')"><div class="art">${p.icon}<small>${p.tag}</small></div><div class="bodyp"><span class="tag">${p.cat}</span><h3>${p.n}</h3><div class="footp"><span class="price">от ${rub(p.price)}</span><button class="add" aria-label="Подробнее">+</button></div></div></article>`).join(''):'<div class="empty">В этой категории пока нет товаров</div>';updateBadge()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;cat='Все';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat==='Все'));render()});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('search').oninput=render;
function detail(id){const p=products.find(x=>x.id===id);document.getElementById('sheet').innerHTML=`<div class="sheettop"><span class="muted">Карточка товара</span><button class="close" onclick="closeModal()">×</button></div><div class="detailart">${p.icon}</div><span class="tag">${p.tag}</span><h2>${p.n}</h2><p>Выбери регион и номинал. Оплата пока отключена.</p><b>Регион</b><div class="options" id="regions">${p.region.map((r,i)=>`<button class="option ${i===0?'selected':''}" onclick="pick(this)">${r}</button>`).join('')}</div><b>Номинал</b><div class="options" id="values">${p.values.map((v,i)=>`<button class="option ${i===0?'selected':''}" onclick="pick(this)">${p.id==='apple-us'?'$'+v:typeof v==='number'?rub(v):v}</button>`).join('')}</div><div class="muted">Ориентировочная цена: от ${rub(p.price)}</div><button class="primary wide" onclick="addCart('${id}')">Добавить в корзину</button>`;document.getElementById('modal').style.display='flex'}
function pick(el){el.parentElement.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function closeModal(){document.getElementById('modal').style.display='none'}
function addCart(id){const p=products.find(x=>x.id===id);cart.push({id,name:p.n,region:document.querySelector('#regions .selected').textContent,value:document.querySelector('#values .selected').textContent,price:p.price});saveCart();closeModal();openCart()}
function saveCart(){localStorage.setItem('tw_cart',JSON.stringify(cart));updateBadge()}
function updateBadge(){const b=document.querySelector('[data-tab="orders"]');b.innerHTML='<b>▤</b>Заказы'+(cart.length?'<span class="badge">'+cart.length+'</span>':'')}
function openCart(){document.getElementById('sheet').innerHTML='<div class="sheettop"><h2>Корзина · '+cart.length+'</h2><button class="close" onclick="closeModal()">×</button></div>'+(cart.length?cart.map((x,i)=>'<div class="cartrow"><div>'+x.name+'<br><span class="muted">'+x.region+' · '+x.value+'</span></div><button onclick="removeCart('+i+')">Удалить</button></div>').join('')+'<div class="total"><span>Итого</span><span>'+rub(cart.reduce((a,x)=>a+x.price,0))+'</span></div><button class="primary wide" onclick="checkout()">Создать заказ (демо)</button><p>Оплата отключена. Заказ сохранится как ожидающий оплаты.</p>':'<p>Корзина пуста. Выбери товар в каталоге.</p>';document.getElementById('modal').style.display='flex'}
function removeCart(i){cart.splice(i,1);saveCart();openCart()}
function checkout(){if(!cart.length)return;orders.unshift({id:'TW-'+Date.now().toString().slice(-6),items:cart.slice(),total:cart.reduce((a,x)=>a+x.price,0),status:'Ожидает оплаты · демо',date:new Date().toLocaleDateString('ru-RU')});localStorage.setItem('tw_orders',JSON.stringify(orders));cart=[];saveCart();closeModal();showOrders()}
function showOrders(){document.getElementById('sheet').innerHTML='<div class="sheettop"><h2>Заказы</h2><button class="close" onclick="closeModal()">×</button></div>'+(orders.length?orders.map(o=>'<div class="steps" style="margin:12px 0"><b>'+o.id+'</b><p>'+o.date+' · '+rub(o.total)+'</p><span class="muted">'+o.status+'</span></div>').join(''):'<p>Заказов пока нет.</p>')+'<p class="muted">История хранится на устройстве (демо).</p>';document.getElementById('modal').style.display='flex'}
function showProfile(){document.getElementById('sheet').innerHTML='<div class="sheettop"><h2>Профиль</h2><button class="close" onclick="closeModal()">×</button></div><div class="steps">Apple Gift Card — инструкция активации<br><br>Оплата iCloud и приложений<br><br>FAQ · Условия · Политика конфиденциальности<br><br>Поддержка менеджера</div>';document.getElementById('modal').style.display='flex'}
function showRef(){document.getElementById('sheet').innerHTML='<div class="sheettop"><h2>Рефералы</h2><button class="close" onclick="closeModal()">×</button></div><div class="steps">10% вознаграждения от покупок приглашённых (активация после подключения бота).<br><br>Баланс: 0 ₽<br>Приглашено: 0<br>Начисления: 0 ₽</div>';document.getElementById('modal').style.display='flex'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab==='catalog'){closeModal();goCatalog()}else if(b.dataset.tab==='orders')showOrders();else if(b.dataset.tab==='ref')showRef();else showProfile()});
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
render();
</script></body></html>
