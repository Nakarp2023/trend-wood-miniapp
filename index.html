<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111014"><title>TREND WOOD — цифровой магазин</title>
<style>
:root{--bg:#111014;--card:#1b1920;--line:#302b37;--txt:#f8f5fa;--muted:#a49cab;--violet:#c7a5ff;--violet2:#8c62d4;--green:#b6f0cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:540px;margin:auto;min-height:100dvh;padding-bottom:92px;background:radial-gradient(ellipse at 85% -5%,#382447 0,transparent 35%),var(--bg)}header{display:flex;align-items:center;justify-content:space-between;padding:22px 19px 16px}.brand{font-weight:900;letter-spacing:2px;font-size:18px}.brand span{color:var(--violet)}.iconbtn{background:#25212b;border:1px solid var(--line);border-radius:13px;padding:9px 12px;font-size:12px;color:#ddd3e9}.hero{margin:0 15px 22px;padding:23px 21px 20px;border:1px solid #483458;border-radius:25px;background:linear-gradient(135deg,#342344,#1d1924 75%);position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:12px;top:-9px;font-size:115px;color:#b28be8;opacity:.13}.eyebrow{font-size:10px;letter-spacing:2px;color:#cbb3ed;text-transform:uppercase}.hero h1{font-size:28px;line-height:1.13;letter-spacing:-.6px;margin:11px 0 9px;max-width:300px}.hero p{font-size:13px;color:#c8bdcf;margin:0 0 18px;max-width:300px}.cta{background:linear-gradient(135deg,#d2b5ff,#9d76e5);color:#1b1224;border-radius:13px;padding:12px 16px;font-weight:750}.section{padding:0 16px;margin:14px 0}.section#catalog{margin-top:10px}.head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 13px}.head h2{font-size:18px;margin:0;font-weight:760}.muted{font-size:12px;color:var(--muted)}.seg{display:flex;background:#1b1920;border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:13px}.seg button{flex:1;background:none;color:#a69eae;padding:10px 5px;border-radius:10px;font-weight:650}.seg button.active{background:#3a2d49;color:#f1e7ff}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#1b1920;color:white;outline:none;margin-bottom:12px}.search:focus{border-color:#8e6bb5}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px}.chip{white-space:nowrap;background:#1b1920;border:1px solid var(--line);padding:8px 13px;border-radius:99px;font-size:12px;color:#bcb4c5}.chip.active{background:#382944;border-color:#76569c;color:#e9d9ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{box-shadow:0 8px 24px #0002}.art{height:130px}.bodyp{padding:13px}.product h3{font-size:14px;min-height:38px}.product{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.art{height:112px;display:grid;place-items:center;background:linear-gradient(145deg,#2a2332,#17151b);font-size:42px;position:relative}.art small{position:absolute;right:9px;top:8px;font-size:9px;background:#ffffff12;border:1px solid #ffffff16;border-radius:6px;padding:4px 6px;color:#d8cbe5}.bodyp{padding:12px}.tag{font-size:10px;color:#c9aaff;background:#342541;border-radius:6px;padding:4px 6px;display:inline-block;margin-bottom:7px}.product h3{font-size:13px;margin:0 0 8px;line-height:1.35;min-height:35px}.footp{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.price{font-weight:800;font-size:14px}.add{width:31px;height:31px;border-radius:10px;background:#c9a8ff;color:#1c1324;font-size:20px;font-weight:700}.notice{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;color:#b9b0c3;font-size:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#17151bed;backdrop-filter:blur(20px);border-top:1px solid #302b37;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav{background:transparent;color:#898291;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;padding:5px;position:relative}.nav b{font-size:20px;font-weight:500}.nav.active{color:#d5baff}.badge{position:absolute;top:0;right:22%;background:#c7a5ff;color:#17111f;border-radius:20px;font-size:9px;padding:2px 5px}.toast{position:fixed;bottom:98px;left:50%;transform:translateX(-50%);background:#30243d;border:1px solid #644b82;border-radius:13px;padding:11px 16px;font-size:12px;z-index:15;display:none;white-space:nowrap;max-width:90%;text-align:center}.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);z-index:20;display:none;align-items:flex-end;justify-content:center}.sheet{width:min(540px,100%);background:#1b1920;border:1px solid #39313f;border-radius:25px 25px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}.sheettop{display:flex;justify-content:space-between;align-items:center}.close{background:#302b36;border-radius:10px;width:34px;height:34px;font-size:18px}.detailart{height:145px;border-radius:17px;background:linear-gradient(140deg,#34263f,#17151b);display:grid;place-items:center;font-size:60px;margin:15px 0}.sheet h2{font-size:21px;margin:10px 0}.sheet p{color:var(--muted);font-size:13px}.options{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.option{border:1px solid var(--line);background:#25212b;border-radius:10px;padding:9px 12px;font-size:12px}.option.selected{border-color:#a47cda;background:#392b49;color:#e7d5ff}.wide{width:100%;margin-top:12px}.cartrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;font-size:13px}.cartrow button{background:#302a37;border-radius:8px;padding:5px 9px}.total{display:flex;justify-content:space-between;font-weight:800;padding:16px 0}
</style></head><body><main class="app">
<header><div class="brand">TREND <span>WOOD</span></div><button class="iconbtn" onclick="toast('Поддержка будет подключена к Telegram-менеджеру')">Поддержка ↗</button></header>
<section class="hero"><div class="eyebrow">DIGITAL STORE · 24/7</div><h1>Твой цифровой мир — в одном месте</h1><p>Коды, подписки и приложения. Выбирай нужное — быстро и удобно.</p><button class="cta" onclick="goCatalog()">Перейти в каталог →</button></section><section class="section" id="catalog"><div class="head"><h2>Каталог</h2><span class="muted" id="count">0 товаров</span></div>
<div class="seg"><button class="active" data-mode="codes">🎟 Коды</button><button data-mode="apps">📲 Приложения</button></div><input class="search" id="search" placeholder="⌕  Найти товар или подписку…"/>
<div class="chips" id="chips"><button class="chip active" data-cat="Все">Все</button><button class="chip" data-cat="Игры">Игры</button><button class="chip" data-cat="Подарочные карты">Подарочные карты</button><button class="chip" data-cat="Подписки">Подписки</button><button class="chip" data-cat="Сервисы">Сервисы</button></div><div class="grid" id="products"></div></section>
<section class="section"><div class="head"><h2>Покупать просто</h2><span class="muted">3 шага</span></div><div class="notice">① Выбери цифровой товар<br><br>② Укажи регион и номинал<br><br>③ Получи заказ после оформления</div></section><nav class="bottom"><button class="nav active" data-tab="catalog"><b>⌂</b>Каталог</button><button class="nav" data-tab="orders"><b>▤</b>Заказы</button><button class="nav" data-tab="ref"><b>♧</b>Рефералы</button><button class="nav" data-tab="profile"><b>◉</b>Профиль</button></nav>
<div class="toast" id="toast"></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
</main>
<script>
const products=[
{id:'apple-ru',n:'Apple Gift Card · Россия',cat:'Подарочные карты',mode:'codes',icon:'',price:500,tag:'Apple',region:['Россия'],values:[500,1000,2000,5000]},
{id:'apple-us',n:'Apple Gift Card · США',cat:'Подарочные карты',mode:'codes',icon:'',price:700,tag:'USA',region:['США'],values:[10,25,50,100]},
{id:'ps',n:'PlayStation Store',cat:'Игры',mode:'codes',icon:'🎮',price:1000,tag:'PlayStation',region:['США','Турция','Европа'],values:[10,20,50,100]},
{id:'xbox',n:'Xbox Gift Card',cat:'Игры',mode:'codes',icon:'🟩',price:1000,tag:'Xbox',region:['США','Европа'],values:[10,25,50,100]},
{id:'roblox',n:'Roblox',cat:'Игры',mode:'codes',icon:'🟥',price:500,tag:'Roblox',region:['США'],values:[10,20,50]},
{id:'fortnite',n:'Fortnite V-Bucks',cat:'Игры',mode:'codes',icon:'🪙',price:800,tag:'Fortnite',region:['США','Европа'],values:[1000,2800,5000,13500]},
{id:'discord',n:'Discord Nitro',cat:'Подписки',mode:'codes',icon:'💬',price:990,tag:'Discord',region:['Global'],values:['1 месяц','12 месяцев']},
{id:'telegram',n:'Telegram Premium',cat:'Подписки',mode:'apps',icon:'✈️',price:299,tag:'Telegram',region:['Россия'],values:['1 месяц','3 месяца','12 месяцев']},
{id:'ai',n:'AI-сервисы',cat:'Сервисы',mode:'apps',icon:'🤖',price:499,tag:'AI',region:['Global'],values:['1 месяц','3 месяца']},
{id:'ios',n:'Приложения iOS',cat:'Сервисы',mode:'apps',icon:'📱',price:199,tag:'iOS',region:['App Store'],values:['Покупка','Подписка']},
{id:'appsub',n:'Подписки приложений',cat:'Подписки',mode:'apps',icon:'✨',price:299,tag:'Apps',region:['Global'],values:['1 месяц','12 месяцев']}
];
let mode='codes',cat='Все',cart=JSON.parse(localStorage.getItem('tw_cart')||'[]'),orders=JSON.parse(localStorage.getItem('tw_orders')||'[]'),tab='catalog';
const rub=n=>typeof n==='number'?n.toLocaleString('ru-RU')+' ₽':n;
function goCatalog(){document.getElementById("catalog").scrollIntoView({behavior:"smooth"})}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const a=products.filter(p=>p.mode===mode&&(cat==='Все'||p.cat===cat)&&(!q||(p.n+' '+p.tag+' '+p.cat).toLowerCase().includes(q)));document.getElementById('count').textContent=a.length+' товаров';document.getElementById('products').innerHTML=a.map(p=>`<article class="product" onclick="detail('${p.id}')"><div class="art">${p.icon}<small>${p.tag}</small></div><div class="bodyp"><span class="tag">${p.cat}</span><h3>${p.n}</h3><div class="footp"><span class="price">от ${rub(p.price)}</span><button class="add" aria-label="Подробнее">+</button></div></div></article>`).join('')||'<div class="notice" style="grid-column:1/-1">В этой категории нет товаров</div>';updateBadge()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));cat='Все';document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat==='Все'));render()});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('search').oninput=render;
function detail(id){let p=products.find(x=>x.id===id);document.getElementById('sheet').innerHTML=`<div class="sheettop"><span class="muted">Карточка товара</span><button class="close" onclick="closeModal()">×</button></div><div class="detailart">${p.icon}</div><span class="tag">${p.tag}</span><h2>${p.n}</h2><p>Выбери регион и номинал. Сейчас это витрина без оплаты.</p><b>Регион</b><div class="options" id="regions">${p.region.map((r,i)=>'<button class="option '+(!i?'selected':'')+'" onclick="pick(this)">'+r+'</button>').join('')}</div><b>Номинал</b><div class="options" id="values">${p.values.map((v,i)=>'<button class="option '+(!i?'selected':'')+'" onclick="pick(this)">'+(p.id==='apple-us'?'$'+v:rub(v))+'</button>').join('')}</div><div class="muted">Цена ориентировочная: от ${rub(p.price)}</div><button class="cta wide" onclick="addCart('${id}')">Добавить в корзину</button>`;document.getElementById('modal').style.display='flex'}
function pick(e){e.parentElement.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));e.classList.add('selected')}
function closeModal(){document.getElementById('modal').style.display='none'}
function addCart(id){let p=products.find(x=>x.id===id),region=document.querySelector('#regions .selected').textContent,value=document.querySelector('#values .selected').textContent;cart.push({id,name:p.n,region,value,price:p.price});saveCart();closeModal();openCart()}
function saveCart(){localStorage.setItem('tw_cart',JSON.stringify(cart));updateBadge()}
function updateBadge(){let b=document.querySelector('[data-tab="orders"]');b.innerHTML='<b>▤</b>Заказы'+(cart.length?'<span class="badge">'+cart.length+'</span>':'')}
function openCart(){document.getElementById('sheet').innerHTML='<div class="sheettop"><h2>Корзина · '+cart.length+'</h2><button class="close" onclick="closeModal()">×</button></div>'+(cart.length?cart.map((x,i)=>'<div class="cartrow"><div>'+x.name+'<br><span class="muted">'+x.region+' · '+x.value+'</span></div><button onclick="removeCart('+i+')">Удалить</button></div>').join('')+'<div class="total"><span>Итого</span><span>'+rub(cart.reduce((a,x)=>a+x.price,0))+'</span></div><button class="cta wide" onclick="checkout()">Создать заказ (демо)</button><p>Оплата не подключена. Заказ будет сохранён как ожидающий оплаты.</p>':'<p>Корзина пуста. Выбери товар в каталоге.</p>';document.getElementById('modal').style.display='flex'}
function removeCart(i){cart.splice(i,1);saveCart();openCart()}
function checkout(){if(!cart.length)return;orders.unshift({id:'TW-'+Date.now().toString().slice(-6),items:cart.slice(),total:cart.reduce((a,x)=>a+x.price,0),status:'Ожидает оплаты · демо',date:new Date().toLocaleDateString('ru-RU')});localStorage.setItem('tw_orders',JSON.stringify(orders));cart=[];saveCart();closeModal();showOrders()}
function showOrders(){document.getElementById('sheet').innerHTML='<div class="sheettop"><h2>Мои заказы</h2><button class="close" onclick="closeModal()">×</button></div>'+(orders.length?orders.map(o=>'<div class="notice" style="margin:12px 0"><b>'+o.id+'</b><p>'+o.date+' · '+rub(o.total)+'</p><span class="muted">'+o.status+'</span></div>').join(''):'<p>Заказов пока нет.</p>')+'<p class="muted">История хранится на этом устройстве (демо).</p>';document.getElementById('modal').style.display='flex'}
function showProfile(){document.getElementById('sheet').innerHTML='<div class="sheettop"><h2>Профиль</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">Покупки и настройки пользователя<br><br>Apple Gift Card — инструкция активации<br><br>Оплата iCloud и приложений<br><br>FAQ · Условия · Политика конфиденциальности<br><br>Поддержка менеджера</div>';document.getElementById('modal').style.display='flex'}
function showRef(){document.getElementById('sheet').innerHTML='<div class="sheettop"><h2>Рефералы</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">Реферальная программа — 10% от покупок приглашённых (будет активирована после подключения бота).<br><br>Баланс: 0 ₽<br>Приглашено: 0<br>Начисления: 0 ₽</div>';document.getElementById('modal').style.display='flex'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(tab==='catalog')document.getElementById('catalog').scrollIntoView({behavior:'smooth'});else if(tab==='orders')showOrders();else if(tab==='ref')showRef();else showProfile()});
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
render();
</script></body></html>
